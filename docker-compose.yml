version: "3.8"
services:
  ghost:
    image: ghost:6-alpine
    restart: always
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: root
      database__connection__password: example
      database__connection__database: ghost
      url: ${GHOST_HOST}
      security__staffDeviceVerification: false
      mail__from: christian@krey.io
      mail__transport: SMTP
      mail__options__host: smtp-relay.brevo.com
      mail__options__port: 587
      mail__options__auth__user: a570bb001@smtp-brevo.com
      mail__options__auth__pass: 7kUcQYXMw5LbExNr

    depends_on:
      - db
    ports:
      - "2368:2368"
    volumes:
      - ghost:/var/lib/ghost/content
      - ./ghost-theme:/var/lib/ghost/content/themes/kreyio-theme

  db:
    image: mysql:8.0
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: example
    volumes:
      - db:/var/lib/mysql

volumes:
  ghost:
  db:
